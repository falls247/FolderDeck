# dev/docs の目録と目次（開発者・エージェント向け）
#
# 使い方
#   1. まず topics の summary / read_when を見て、読む文書を選ぶ。
#   2. sections（目次）で必要な節を選び、その節だけ読む（文書を通読しない）。
#      SPEC の id は節番号（§n.n）で、コードコメントの「§9.6」などと一致する。
#      コードの対応箇所は `rg "§9\.6" src` で引ける。
#
# 同期ルール
#   - 各 Markdown の front matter（id / title / summary / tags / status / updated）は、
#     ここの同じ項目と一致させる。sections は front matter には書かず、ここだけに書く。
#   - dev/docs に文書を追加・更新・削除したら、同じコミットでこの目録と front matter を更新する。
#   - 見出しを変えたら sections も直す。

